<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FF Assistant — Draft</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header id="app-header">
    <div class="header-row">
      <h1>FF Assistant</h1>
      <nav id="section-nav">
        <button class="section-button active" data-section="draft_tool">Draft Tool</button>
        <button class="section-button" data-section="in_season">In-season</button>
        <button class="section-button" data-section="exposure">Exposure</button>
        <button class="section-button" data-section="league_settings">League Settings</button>
        <button class="section-button" data-section="wl">W-L</button>
      </nav>
    </div>

    <div id="league-select-row" class="header-row">
      <select id="league-select"></select>
    </div>

    <div id="draft-tool-controls" class="header-row">
      <select id="scoring-format-select">
        <option value="full_ppr">Full PPR</option>
        <option value="half_ppr">Half PPR</option>
        <option value="non_ppr">Non-PPR</option>
        <option value="superflex">Superflex</option>
      </select>
      <button id="refresh-rankings-button" type="button">Refresh Rankings</button>
      <span id="rankings-sync-status" class="rankings-sync-status"></span>
    </div>
    <nav id="tab-bar">
      <button class="tab-button active" data-tab="draft">Draft</button>
      <button class="tab-button" data-tab="grid">Grid</button>
      <button class="tab-button" data-tab="combined">Draft + Grid</button>
      <button class="tab-button" data-tab="tiers">Tiers</button>
      <button class="tab-button" data-tab="rosters">Rosters</button>
    </nav>

    <div id="in-season-controls" class="header-row">
      <input type="number" id="in-season-week-input" placeholder="Week" min="1" max="18" />
    </div>
    <nav id="in-season-tab-bar">
      <button class="tab-button active" data-in-season-tab="weekly">Weekly</button>
      <button class="tab-button" data-in-season-tab="ros">Rest of Season</button>
    </nav>

    <div id="wl-controls" class="header-row">
      <input type="number" id="wl-year-input" placeholder="Year" />
    </div>
    <nav id="wl-tab-bar">
      <button class="tab-button active" data-wl-tab="games">Games</button>
      <button class="tab-button" data-wl-tab="weekly">Weekly</button>
      <button class="tab-button" data-wl-tab="leagues">Leagues</button>
      <button class="tab-button" data-wl-tab="close_games">Close Games</button>
      <button class="tab-button" data-wl-tab="all_time">All Years</button>
    </nav>
  </header>

  <main id="tab-content"></main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
